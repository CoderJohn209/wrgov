<!DOCTYPE html>
<html><head>

<meta charset="UTF-8">

<title>I/\I</title>


<style>

@font-face {
    font-family: "Raster";
    src: url("PxPlus_IBM_VGA8.ttf");
}

body {
    font-family: "Raster", monospace;
    background-color: black;
    max-width: 700px;
    color: #00ff00;
    margin: 40px auto;

}


#login {

    text-align: center;

}


#chatArea {

    display: none;

}


#chat {

    height: 400px;

    border: 1px solid #888;

    padding: 10px;

    overflow-y: auto;

}


#controls {

    display: flex;

    gap: 5px;

    margin-top: 10px;

}


#name {

    width: 120px;

}


#message {

    flex: 1;

}


input {
    font-family: "Raster", monospace;
    padding: 10px;

}


button {
    font-family: "Raster", monospace;
    padding: 10px 15px;

}


.message {

    margin-bottom: 8px;

}


.name {

    font-weight: bold;

}


#status {

    margin: 10px 0;

    font-size: 14px;

}

</style>

</head>


<body>


<!-- ============================= -->
<!-- PASSWORD SCREEN -->
<!-- ============================= -->

<div id="login">

    <h1>KRONOS ENC CHAT</h1>

    <p>
        Enter the shared chat password:
    </p>

    <input id="password" type="password" placeholder="Password">

    <br><br>

    <button onclick="startChat()">
        Enter Chat
    </button>

</div>



<!-- ============================= -->
<!-- CHAT -->
<!-- ============================= -->

<div id="chatArea">

    <h1>SNPDWRGOV Chat</h1>

    <div id="status">
        Connecting...
    </div>

    <div id="chat"></div>

    <div id="controls">

        <input id="name" placeholder="Name">

        <input id="message" placeholder="Message" onkeydown="
                if(event.key === 'Enter')
                    send()
            ">

        <button onclick="send()">
            Send
        </button>

    </div>

</div>



<script>


/* =========================================
   SETTINGS
   ========================================= */


const SERVER =
    "wss://cdb.lalosjexperiments.workers.dev/";


/*
    All users use the same password.

    The password NEVER gets sent to the server.
*/


let socket = null;

let encryptionKey = null;



/* =========================================
   CREATE AES-256 KEY
   ========================================= */


async function createKey(password) {


    const encoder =
        new TextEncoder();


    /*
        Fixed salt.

        Everyone with the same password
        derives the same encryption key.
    */


    const salt =
        encoder.encode(
            "SNPDWRGOV-CHAT-SALT-v1"
        );


    /*
        Convert password into PBKDF2
        key material.
    */


    const keyMaterial =
        await crypto.subtle.importKey(

            "raw",

            encoder.encode(password),

            "PBKDF2",

            false,

            ["deriveKey"]

        );


    /*
        Derive a 256-bit AES-GCM key.
    */


    return crypto.subtle.deriveKey(

        {

            name: "PBKDF2",

            salt: salt,

            iterations: 250000,

            hash: "SHA-256"

        },

        keyMaterial,

        {

            name: "AES-GCM",

            length: 256

        },

        false,

        [

            "encrypt",

            "decrypt"

        ]

    );

}



/* =========================================
   START CHAT
   ========================================= */


async function startChat() {


    const password =
        document
        .getElementById("password")
        .value;


    if (!password) {

        alert(
            "Enter the chat password."
        );

        return;

    }


    try {

        encryptionKey =
            await createKey(password);

    }

    catch (error) {

        console.error(error);

        alert(
            "Could not create encryption key."
        );

        return;

    }


    /*
        Remove password screen.
    */

    document
        .getElementById("login")
        .style.display = "none";


    /*
        Show chat.
    */

    document
        .getElementById("chatArea")
        .style.display = "block";


    connect();

}



/* =========================================
   CONNECT
   ========================================= */


function connect() {


    socket =
        new WebSocket(SERVER);


    socket.onopen = function() {

        document
            .getElementById("status")
            .textContent =
            "Connected — end-to-end encrypted";

    };


    socket.onclose = function() {

        document
            .getElementById("status")
            .textContent =
            "Disconnected";

    };


    socket.onerror = function() {

        document
            .getElementById("status")
            .textContent =
            "Connection error";

    };


    socket.onmessage =
        async function(event) {


        try {


            /*
                The server sends us the encrypted
                JSON object.
            */


            const encrypted =
                JSON.parse(event.data);


            /*
                Decrypt locally.
            */


            const text =
                await decryptMessage(
                    encrypted
                );


            /*
                Display plaintext locally.
            */


            displayMessage(text);

        }


        catch(error) {


            console.error(
                "Decryption failed:",
                error
            );


        }

    };

}



/* =========================================
   ENCRYPT
   ========================================= */


async function encryptMessage(text) {


    const encoder =
        new TextEncoder();


    /*
        Generate a NEW random IV
        for every message.
    */


    const iv =
        crypto.getRandomValues(
            new Uint8Array(12)
        );


    /*
        Encrypt with AES-256-GCM.
    */


    const encrypted =
        await crypto.subtle.encrypt(

            {

                name: "AES-GCM",

                iv: iv

            },

            encryptionKey,

            encoder.encode(text)

        );


    return {

        iv:
            arrayToBase64(iv),

        ciphertext:
            arrayToBase64(
                new Uint8Array(encrypted)
            )

    };

}



/* =========================================
   DECRYPT
   ========================================= */


async function decryptMessage(data) {


    const decoder =
        new TextDecoder();


    const iv =
        base64ToArray(data.iv);


    const ciphertext =
        base64ToArray(
            data.ciphertext
        );


    const decrypted =
        await crypto.subtle.decrypt(

            {

                name: "AES-GCM",

                iv: iv

            },

            encryptionKey,

            ciphertext

        );


    return decoder.decode(
        decrypted
    );

}



/* =========================================
   SEND
   ========================================= */


async function send() {


    const name =
        document
        .getElementById("name")
        .value
        .trim();


    const message =
        document
        .getElementById("message")
        .value
        .trim();


    if (!name || !message) {

        return;

    }


    if (
        !socket ||
        socket.readyState !==
        WebSocket.OPEN
    ) {

        alert(
            "Not connected to chat."
        );

        return;

    }


    /*
        Encrypt BOTH username and message.
    */


    const plaintext =
        JSON.stringify({

            name: name,

            message: message

        });


    const encrypted =
        await encryptMessage(
            plaintext
        );


    /*
        ONLY encrypted data is sent
        to Cloudflare.
    */


    socket.send(
        JSON.stringify(encrypted)
    );


    document
        .getElementById("message")
        .value = "";

}



/* =========================================
   DISPLAY MESSAGE
   ========================================= */


function displayMessage(text) {


    const data =
        JSON.parse(text);


    const div =
        document.createElement("div");


    div.className =
        "message";


    const name =
        document.createElement("span");


    name.className =
        "name";


    name.textContent =
        data.name + ": ";


    const message =
        document.createElement("span");


    message.textContent =
        data.message;


    div.appendChild(name);

    div.appendChild(message);


    document
        .getElementById("chat")
        .appendChild(div);


    const chat =
        document.getElementById("chat");


    chat.scrollTop =
        chat.scrollHeight;

}



/* =========================================
   BASE64
   ========================================= */


function arrayToBase64(array) {


    let binary = "";


    for (
        let i = 0;
        i < array.length;
        i++
    ) {

        binary +=
            String.fromCharCode(
                array[i]
            );

    }


    return btoa(binary);

}



function base64ToArray(base64) {


    const binary =
        atob(base64);


    const array =
        new Uint8Array(
            binary.length
        );


    for (
        let i = 0;
        i < binary.length;
        i++
    ) {

        array[i] =
            binary.charCodeAt(i);

    }


    return array;

}


</script>

</body></html>
